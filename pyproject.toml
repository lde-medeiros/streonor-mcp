[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streonor-mcp"
version = "0.8.4"
description = "Community MCP tools for STREONOR profiles, actions and icons"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.9,<2", "Pillow>=11,<14", "resvg-py>=0.5,<0.6"]

[project.optional-dependencies]
live = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/lde-medeiros/streonor-mcp"
Issues = "https://github.com/lde-medeiros/streonor-mcp/issues"

[project.scripts]
streonor-mcp = "streonor_mcp.server:main"

[tool.setuptools.packages.find]
include = ["streonor_mcp*"]
