name: Prepare draft release

on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'lde-medeiros/streonor-mcp' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$RELEASE_SHA" --status success --limit 1 --json conclusion)
          if ! jq -e 'length == 1' <<<"$passed" >/dev/null; then
            echo 'Wait for Checks to pass on this main commit, then run this workflow again.'
            exit 1
          fi
      - name: Check version and extract release notes
        id: metadata
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A stable X.Y.Z version is required.")
          server = json.loads(Path("server.json").read_text())
          if server["version"] != version or not any(
              p["registryType"] == "pypi" and p["identifier"] == project["name"] and p["version"] == version
              for p in server["packages"]
          ):
              raise SystemExit("The package and MCP Registry versions must agree.")
          changelog = Path("CHANGELOG.md").read_text()
          notes = re.search(rf"(?m)^## {re.escape(version)}[ \t]*\n((?:(?!^## )[\s\S])*)", changelog)
          if not notes or not notes[1].strip():
              raise SystemExit(f"Add release notes under ## {version} in CHANGELOG.md.")
          Path("release-notes.md").write_text(notes[1].strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "Release or tag $tag already exists."
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and validate distributions
        if: steps.release.outputs.needed == 'true'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.needed == 'true'
        with:
          name: release-files
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  draft:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
      - name: Create GitHub draft with attached distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "Release or tag $tag already exists. Use the existing draft or bump the version."
            exit 1
          fi
          gh release create "$tag" \
            "dist/streonor_mcp-$VERSION-py3-none-any.whl" "dist/streonor_mcp-$VERSION.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --draft \
            --title "Streonor MCP $VERSION" --notes-file release-notes.md
